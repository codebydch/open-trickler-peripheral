[general]
verbose = True


[bluetooth]
name = Trickler


[scale]
# See the SCALES variable in scales.py for options.
model = and
# /dev/ttyUSB0 for USB-to-serial or /dev/ttyAMA0 for serial over GPIO.
port = /dev/ttyUSB0
# Usually the max, or default, baudrate supported by your scale.
baudrate = 19200
# Scale timeout in seconds.
timeout = 0.1
# Open trickler version for legacy status mapping. Don't change unless you know what you are doing.
status_map_version = 0
# For scales that don't provide a stability flag, a number of consecutive readings to infer stability.
stable_reading_length = 5


[motor1]
trickler_pin = 18
trickler_max_pwm = 100
trickler_min_pwm = 32

[motor2]
trickler_pin = 12
trickler_max_pwm = 100
trickler_min_pwm = 32

[trickler]
# All of the weights in this section are given in GRAINS and are converted
# automatically when the scale is set to grams.
#
# Weight still to go at which trickler motor 2 (the coarse trickler) shuts off and
# motor 1 finishes the charge on its own. This is the most important setting here:
# it must be larger than the amount both motors together can throw during the time
# the scale takes to report a change (roughly feed rate x scale lag), otherwise the
# charge can blow past the target before the first reading moves. Raise it if
# charges still run heavy, lower it if charges take too long.
fine_trickle_weight = 2.0
# Weight still to go at which motor 1 stops running continuously and switches to
# short pulses, pausing after each one so the scale can catch up. Raise this for
# less overshoot at the cost of a slower charge.
pulse_trickle_weight = 0.15
# How long motor 1 runs for each pulse, in seconds. Shorter pulses drop less
# powder at a time; too short and the motor won't move any.
pulse_on_time = 0.03
# How long to pause after each pulse so the powder can land and the scale can
# report it before the next reading is acted on, in seconds.
pulse_off_time = 0.15
# Motor speed (PWM %) used while pulsing. Should be at or near the motor's
# trickler_min_pwm.
pulse_pwm = 32
# Stop tricking this far short of the target weight, to allow for powder that is
# already in flight and for the scale's own lag. Leave at 0 to stop the moment the
# scale reads the target weight; raise it if charges still come out heavy.
cutoff_weight = 0.0
# Number of scale readings averaged when working out how fast powder is landing.
# Larger values are steadier but slower to react.
rate_window = 4
# How far ahead, in seconds, to project that feed rate when deciding to slow down or
# stop. This covers the powder already in flight plus the scale's own reporting lag,
# and is what stops the tricklers before the reading hits the target rather than
# after. Set to 0 to disable the projection entirely.
lookahead_time = 0.35


[servo]
# This is the GPIO number of the pin, not the physical number of the pin
servo_pin = 17
# angle the server goes to when dumping powder
servo_angle = 92
# angle the servo starts at and returns to
initial_angle = 0
# maximum angle the servo can go to
max_angle = 180
# In microseconds
min_pulse_width = 500
# In microseconds
max_pulse_width = 2500


[buttons]
# GPIO pin for button1 is usually 23
button1_gpio = 23
# GPIO pin for button2 is usually 24
button2_gpio = 24


[screen]
font_path = /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf


[leds]
# https://gpiozero.readthedocs.io/en/stable/recipes_advanced.html#controlling-the-pi-s-own-leds
status_led_pin = 47
active_high = False
enable_status_leds = True
ready_status_led_mode = pulse
running_status_led_mode = on
done_status_led_mode = fast_blink


[PID]
# Higher Kp values will:
# - decrease rise time
# - increase overshoot
# - slightly increase settling time
# - decrease steady-state error
# - degrade stability
#Kp = 10
Kp = 10
# Higher Ki values will:
# - slightly decrease rise time
# - increase overshoot
# - increase settling time
# - largely decrease steady-state error
# - degrade stability
#Ki = 2.3
Ki = 1.55
# Higher Kd values will:
# - slightly decrease rise time
# - decrease overshoot
# - decrease settling time
# - minorly affect steady-state error
# - improve stability
#Kd = 3.75
Kd = 3.75
# Enable for use with pidtuner.com
pid_tuner_mode = False


[memcache_vars]
# Variable names used for memcache.
AUTO_MODE = auto_mode
SCALE_IS_STABLE = scale_is_stable
SCALE_RESOLUTION = scale_resolution
SCALE_STATUS = scale_status
SCALE_UNIT = scale_unit
SCALE_UNITS = scale_units
SCALE_WEIGHT = scale_weight
SCALE_UNIT_MAP = scale_unit_map
SCALE_REVERSE_UNIT_MAP = scale_reverse_unit_map
SCALE_STATUS_MAP = scale_status_map
SCALE_RESOLUTION_MAP = scale_resolution_map
TARGET_WEIGHT = target_weight
TARGET_UNIT = target_unit
TRICKLER_MOTOR_SPEED = trickler_motor_speed
